:root{
  --paper:#f4efe6;--ink:#1f1b16;--muted:#6b6358;--line:#d8cfbf;--accent:#d9481c;--mark:#ffd84d;

  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;

html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.65}
a{color:inherit}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
::selection{background:var(--mark);color:#1f1b16}
.wrap{max-width:860px;margin:0 auto;padding:0 28px}
header{padding:26px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:600;font-size:20px;text-decoration:none}
nav{display:flex;gap:24px;font-size:16px}
nav a{text-decoration:none;background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 2px no-repeat;transition:background-size .25s;padding-bottom:2px}
nav a:hover{background-size:100% 2px}
.hero{padding:70px 0 90px;position:relative}
.hand{font-family:var(--hand);font-size:28px;color:var(--accent);margin:0 0 6px;transform:rotate(-2deg);display:inline-block}
